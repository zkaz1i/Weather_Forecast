<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Weather Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="animated-bg" aria-hidden="true">
        <div class="sky-overlay"></div>
    </div>
    <main class="auth-shell glass-card">
        <a class="auth-back" href="{{ url_for('index') }}"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h1>Log in</h1>
        <p class="auth-lead">Use your email and password to access saved cities and preferences.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <ul class="flash-list">
            {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <form class="auth-form" method="post" action="{{ url_for('login') }}">
            <label>
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </label>
            <button type="submit" class="auth-submit">Log in</button>
        </form>
        <p class="auth-switch">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </main>
</body>
</html>
